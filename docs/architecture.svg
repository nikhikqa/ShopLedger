<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger showing browser, Express routes, library modules, config and JSON storage, plus the numbered place-order flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#475569}.head{font-size:16px;font-weight:700}.label{font-size:13px}.small{font-size:12px}.tiny{font-size:12px;fill:#475569}.flow{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.box{rx:10;stroke-width:1.5}.num{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="42" class="title">ShopLedger · application architecture</text>
  <text x="32" y="66" class="sub">Express POS · order, Khata, inventory, pricing and printable GST invoice</text>

  <!-- browser -->
  <rect x="28" y="108" width="194" height="114" class="box" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="48" y="136" class="head">Browser UI · public/</text>
  <text x="48" y="160" class="label">index.html · css/style.css</text>
  <text x="48" y="181" class="label">js/app.js · place handler</text>
  <text x="48" y="202" class="tiny">POST /api/orders</text>

  <!-- server -->
  <rect x="273" y="108" width="208" height="114" class="box" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="293" y="136" class="head">server.js</text>
  <text x="293" y="160" class="label">Express app · JSON body parser</text>
  <text x="293" y="181" class="label">static public/ · mounts routers</text>
  <text x="293" y="202" class="tiny">GET /orders/:id/invoice</text>
  <path d="M222 164 H273" class="flow"/><text x="227" y="151" class="tiny">HTTP</text>

  <!-- routes -->
  <rect x="526" y="99" width="250" height="284" class="box" fill="#fff7ed" stroke="#fb923c"/>
  <text x="548" y="128" class="head">routes/ · mounted at /api</text>
  <rect x="548" y="143" width="206" height="42" rx="7" fill="#ffedd5" stroke="#fdba74"/>
  <text x="562" y="169" class="label">orders.js · POST /orders</text>
  <rect x="548" y="196" width="206" height="38" rx="7" fill="#fff" stroke="#fed7aa"/>
  <text x="562" y="220" class="label">products.js · /products, /coupons</text>
  <rect x="548" y="244" width="206" height="38" rx="7" fill="#fff" stroke="#fed7aa"/>
  <text x="562" y="268" class="label">customers.js · /customers</text>
  <rect x="548" y="292" width="206" height="38" rx="7" fill="#fff" stroke="#fed7aa"/>
  <text x="562" y="316" class="label">reports.js · reports, preview, export</text>
  <text x="548" y="359" class="tiny">Order route coordinates validation, totals, stock and ledger</text>
  <path d="M481 164 H526" class="flow"/>

  <!-- config and persistence -->
  <rect x="835" y="108" width="326" height="88" class="box" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="856" y="137" class="head">config.js</text>
  <text x="856" y="160" class="label">shop · tax HSN slabs · coupons · inventory defaults</text>
  <path d="M776 150 H835" class="flow dash"/>
  <rect x="835" y="237" width="326" height="100" class="box" fill="#dcfce7" stroke="#4ade80"/>
  <text x="856" y="267" class="head">data/db.json</text>
  <text x="856" y="291" class="label">products · customers · orders · settlements</text>
  <text x="856" y="314" class="label">ID counters · auditLog</text>
  <path d="M776 308 H835" class="flow"/><text x="781" y="296" class="tiny">store.read/write</text>

  <!-- library modules -->
  <rect x="28" y="432" width="1144" height="222" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="50" y="462" class="head">lib/ · business logic and persistence</text>
  <rect x="50" y="482" width="180" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="66" y="507" class="label">pricing.js</text><text x="66" y="530" class="tiny">subtotal · computeTotals</text>
  <rect x="246" y="482" width="154" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="262" y="507" class="label">coupons.js</text><text x="262" y="530" class="tiny">validate · discount</text>
  <rect x="416" y="482" width="142" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="432" y="507" class="label">tax.js</text><text x="432" y="530" class="tiny">HSN rate · GST split</text>
  <rect x="574" y="482" width="154" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="590" y="507" class="label">inventory.js</text><text x="590" y="530" class="tiny">find · check · reserve</text>
  <rect x="744" y="482" width="142" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="760" y="507" class="label">ledger.js</text><text x="760" y="530" class="tiny">Khata charge</text>
  <rect x="902" y="482" width="134" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="918" y="507" class="label">orders.js</text><text x="918" y="530" class="tiny">add · get · cancel</text>
  <rect x="1052" y="482" width="98" height="64" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1063" y="507" class="label">store.js</text><text x="1063" y="530" class="tiny">JSON I/O</text>
  <rect x="50" y="565" width="180" height="56" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="66" y="589" class="label">reports.js</text><text x="66" y="609" class="tiny">dashboard · reconciliation</text>
  <rect x="246" y="565" width="154" height="56" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="262" y="589" class="label">dates.js</text><text x="262" y="609" class="tiny">today · date keys</text>
  <rect x="416" y="565" width="246" height="56" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="432" y="589" class="label" fill="#9d174d">invoice.js · highlighted ticket</text><text x="432" y="609" class="tiny">computeInvoiceFigures · render</text>
  <text x="686" y="589" class="tiny">invoice route in server.js calls orders.get → invoice.render</text>
  <path d="M376 222 V405 H118 V482" class="flow dash"/>
  <path d="M650 383 V432" class="flow"/>
  <path d="M993 383 V432" class="flow"/>

  <!-- numbered flow -->
  <text x="32" y="687" class="head">Place an order · numbered request and persistence flow</text>
  <g>
    <circle cx="53" cy="722" r="13" fill="#2563eb"/><text x="53" y="722" class="num">1</text>
    <text x="73" y="727" class="small">UI POST /api/orders</text>
    <circle cx="271" cy="722" r="13" fill="#2563eb"/><text x="271" y="722" class="num">2</text>
    <text x="291" y="727" class="small">orders route resolves items + checks stock</text>
    <circle cx="589" cy="722" r="13" fill="#2563eb"/><text x="589" y="722" class="num">3</text>
    <text x="609" y="727" class="small">coupons + pricing → tax slabs → totals</text>
    <circle cx="866" cy="722" r="13" fill="#2563eb"/><text x="866" y="722" class="num">4</text>
    <text x="886" y="727" class="small">Khata charge (if selected) + reserve stock</text>
    <circle cx="53" cy="765" r="13" fill="#2563eb"/><text x="53" y="765" class="num">5</text>
    <text x="73" y="770" class="small">orders.add + audit → store.write → data/db.json → 201 order</text>
  </g>
  <rect x="785" y="750" width="14" height="14" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="807" y="762" class="tiny">Ticket focus: lib/invoice.js</text>
  <text x="1005" y="762" class="tiny">tax.js powers checkout pricing</text>
</svg>
